<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Text Summarizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>AI Text Summarizer</h1>

    <textarea id="inputText" placeholder="Paste your article or text here..." rows="12"></textarea>

    <div class="controls">
      <label>Min length <input id="minLen" type="number" value="30" /></label>
      <label>Max length <input id="maxLen" type="number" value="130" /></label>
      <button id="summarizeBtn">Summarize</button>
    </div>

    <h2>Summary</h2>
    <div id="output" class="output"></div>

    <div class="footer">Made with ❤️ — Supriya</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
